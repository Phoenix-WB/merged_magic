license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

displayURL="https://www.curseforge.com/minecraft/mc-mods/merged_magic"

logoFile="merged_magic_logo.png"

credits="Textures from: cebularz_, L200"

authors="pianist_wb"

description='''
Adds items that grant abilities, which can be upgraded by merging them in your inventory.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
#[[mixins]]
#config="${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="5.5.2"
    ordering="NONE"
    side="BOTH"
    
[[dependencies.${mod_id}]]
    modId="itemcooldownfix"
    type="required"
    versionRange="[1.0.0,)"
    ordering="NONE"
    side="BOTH"
